[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "job-scraper-ranker"
version = "1.0.0"
description = "Scrape Indeed job postings and rank by resume compatibility"
requires-python = ">=3.9"

dependencies = [
    "playwright>=1.40.0",
    "beautifulsoup4>=4.12.0",
    "pandas>=2.0.0",
    "pydantic>=2.0.0",
    "sentence-transformers>=2.2.0",
    "scikit-learn>=1.3.0",
    "PyPDF2>=4.0.0",
    "python-docx>=0.8.11",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["black", "flake8", "mypy"]

[tool.setuptools]
packages = ["job_scraper"]
